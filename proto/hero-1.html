<style>
:root {
  --ink: #0d0e0b; --ink2: #16180f; --night: #070b16; --paper: #e6dcc3; --paper-dim: #b9ad90;
  --gold: #c9a54e; --gold-hi: #f3d98f; --green: #2e7558; --green-hi: #79c9a2; --blood: #a4322b; --sand: #c2a576;
  --fg: #ebe3cf; --fg-dim: #a59c86;
  --f-kufi: "Reem Kufi", "Noto Kufi Arabic", "Geeza Pro", sans-serif;
  --f-naskh: Amiri, "Noto Naskh Arabic", "Geeza Pro", serif;
  --f-ruqaa: "Aref Ruqaa", Amiri, serif;
  --f-ui: "IBM Plex Sans Arabic", "Geeza Pro", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--night); color: var(--fg); overflow: hidden; }
.hero { position: relative; width: 100vw; height: 100vh; height: 100svh; overflow: hidden; background: var(--night); }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.meta { position: absolute; z-index: 2; top: calc(env(safe-area-inset-top, 0px) + 22px); right: max(16px, env(safe-area-inset-right, 0px)); margin: 0; display: flex; gap: .7rem; font: 500 .8rem var(--f-ui); color: var(--gold); }
.meta i { font-style: normal; opacity: .6; }
.name { position: absolute; z-index: 2; margin: 0; inset-inline: 0; text-align: center; top: var(--sub-y, 80%); }
.name-a { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.name-b { display: block; font: 400 clamp(1rem, 2.4vmin, 1.5rem) var(--f-kufi); color: var(--fg); letter-spacing: .02em; text-shadow: 0 2px 18px rgba(7, 11, 22, .9); }
.quote { position: absolute; z-index: 2; margin: 0; left: var(--q-l, auto); top: var(--q-t, auto); width: var(--q-w, auto); text-align: center; transform: rotate(-3deg); transform-origin: 50% 50%; }
.quote blockquote { margin: 0; font: 700 var(--q-fs, 2rem)/1.35 var(--f-ruqaa); color: var(--paper); text-shadow: 0 0 1px rgba(243, 217, 143, .6), 0 3px 22px rgba(7, 11, 22, .95); }
.quote blockquote b { font-weight: 700; color: var(--gold-hi); }
.quote figcaption { margin-top: .35rem; font: 400 .72rem/1.6 var(--f-ui); color: var(--gold); opacity: .85; }
.back { position: absolute; z-index: 3; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); font: 400 .72rem var(--f-ui); color: var(--fg-dim); text-decoration: none; }
.back:hover { color: var(--gold-hi); }
</style>
<style>.embed .back, .embed .meta { display: none; }</style>
<script>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add('embed');</script>

  </figure>

</header>
<script>
/*LIB:BEGIN — shared by hero-1/2/3; keep in sync */
const TAU = Math.PI * 2;
const c01 = (v) => Math.min(1, Math.max(0, v));
const mix = (a, b, k) => a + (b - a) * k;
const smooth = (t) => t * t * (3 - 2 * t);
const ss = (a, b, v) => smooth(c01((v - a) / (b - a)));
const rng = (seed) => () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const hash = (i, s = 0) => { const v = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return v - Math.floor(v); };
const css = (a, al = 1) => `rgba(${a[0] | 0},${a[1] | 0},${a[2] | 0},${al})`;
const mixc = (a, b, k) => [mix(a[0], b[0], k), mix(a[1], b[1], k), mix(a[2], b[2], k)];
const C = { // the site palette (styles.css :root) as rgb
  ink: [13, 14, 11], ink2: [22, 24, 15], night: [7, 11, 22], dusk: [27, 36, 64], paper: [230, 220, 195], paperDim: [185, 173, 144],
  gold: [201, 165, 78], goldHi: [243, 217, 143], green: [46, 117, 88], greenHi: [121, 201, 162], blood: [164, 50, 43], sand: [194, 165, 118],
  white: [255, 246, 222], clay: [138, 106, 69],
};
function mkc(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }

// value noise on a 256 lattice, and fractal sums of it
function makeNoise(seed) {
  const R = rng(seed), N = 256, g = new Float32Array(N * N);
  for (let i = 0; i < N * N; i++) g[i] = R();
  const n = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y); let fx = x - xi, fy = y - yi;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
    const a = g[y0 * N + x0], b = g[y0 * N + x1], c = g[y1 * N + x0], d = g[y1 * N + x1];
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  };
  n.fbm = (x, y, o) => { let s = 0, amp = .5, f = 1, nm = 0; for (let i = 0; i < o; i++) { s += amp * n(x * f + i * 17.3, y * f + i * 9.1); nm += amp; amp *= .5; f *= 2.03; } return s / nm; };
  return n;
}
function blurPass(s, d, w, h, r, horiz) {
  const iv = 1 / (2 * r + 1), L = horiz ? w : h, M = horiz ? h : w, st = horiz ? 1 : w, so = horiz ? w : 1;
  for (let m = 0; m < M; m++) {
    const o = m * so; let acc = 0;
    for (let k = -r; k <= r; k++) acc += s[o + Math.min(L - 1, Math.max(0, k)) * st];
    for (let k = 0; k < L; k++) { d[o + k * st] = acc * iv; acc += s[o + Math.min(L - 1, k + r + 1) * st] - s[o + Math.max(0, k - r) * st]; }
  }
}
function boxBlur(src, w, h, r) { // three box passes ≈ a gaussian
  r = Math.max(1, Math.round(r)); const a = Float32Array.from(src), b = new Float32Array(w * h);
  for (let p = 0; p < 3; p++) { blurPass(a, b, w, h, r, true); blurPass(b, a, w, h, r, false); }
  return a;
}

// glow sprites: one baked radial gradient per colour, drawn scaled
const SPR = {};
function sprite(rgb) {
  const k = rgb.join(); if (SPR[k]) return SPR[k];
  const s = mkc(128, 128), g = s.getContext('2d'), q = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  [[0, 1], [.12, .72], [.3, .3], [.55, .09], [.8, .02], [1, 0]].forEach(([o, a]) => q.addColorStop(o, css(rgb, a)));
  g.fillStyle = q; g.fillRect(0, 0, 128, 128); return (SPR[k] = s);
}
function glow(c, x, y, r, rgb, a, ry) { if (a <= 0 || r <= 0) return; c.globalAlpha = Math.min(1, a); c.drawImage(sprite(rgb), x - r, y - (ry || r), 2 * r, 2 * (ry || r)); c.globalAlpha = 1; }

// A holy person is never drawn: only a light. The Prophet: a white-gold orb. The Imams: a gold orb with a halo ring.
function holyLight(c, x, y, r, t, o = {}) {
  const a = o.a ?? 1, br = 1 + .07 * Math.sin(t * 1.25 + (o.ph || 0));
  const halo = o.prophet ? C.goldHi : C.gold, core = o.prophet ? [255, 252, 240] : C.white;
  c.save(); c.globalCompositeOperation = 'lighter';
  glow(c, x, y, r * 11 * br, halo, .22 * a);
  glow(c, x, y, r * 4 * br, o.prophet ? [255, 236, 190] : C.goldHi, .5 * a);
  glow(c, x, y, r * 1.6, core, a);
  if (o.ring) {
    const rr = r * 2.5 * br;
    c.strokeStyle = css(C.goldHi, .16 * a); c.lineWidth = Math.max(2, r * .9); c.beginPath(); c.arc(x, y, rr, 0, TAU); c.stroke();
    c.strokeStyle = css(C.goldHi, .9 * a); c.lineWidth = Math.max(1, r * .2); c.beginPath(); c.arc(x, y, rr, 0, TAU); c.stroke();
  }
  c.restore();
}

// Ink wash: a crisp silhouette (alpha) becomes a window with a roughened edge and a dissolving dry-brush halo.
// Returns {mask, rim}: mask = where the painting shows, rim = the dry-brush strokes outside the crisp edge.
function inkify(shape, o) {
  const w = shape.width, h = shape.height, d = shape.getContext('2d').getImageData(0, 0, w, h).data, n = w * h;
  const A = new Float32Array(n); for (let i = 0; i < n; i++) A[i] = d[i * 4 + 3] / 255;
  const S = boxBlur(A, w, h, o.fine || 1), B = boxBlur(A, w, h, o.spread || 20), E = o.edge ? boxBlur(A, w, h, o.edge) : null;
  const N1 = makeNoise(o.seed || 1), N2 = makeNoise((o.seed || 1) + 7), N3 = makeNoise((o.seed || 1) + 13);
  const ca = Math.cos(o.angle || 0), sa = Math.sin(o.angle || 0);
  const mask = mkc(w, h), rim = mkc(w, h), mi = mask.getContext('2d').createImageData(w, h), ri = rim.getContext('2d').createImageData(w, h);
  const edge = E ? mkc(w, h) : null, ei = E ? edge.getContext('2d').createImageData(w, h) : null, ed = ei && ei.data;
  const md = mi.data, rd = ri.data, grain = o.grain || 2.4, rough = o.rough ?? .55, reach = o.reach ?? 1.75, sl = o.streakL || 70, sw = o.streakW || 1.7, bite = o.bite ?? 1.1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x, b = B[i], s = S[i];
    if (b < .012 && s < .01) continue;
    const nf = N1.fbm(x / grain, y / grain, 2);
    const u = x * ca + y * sa, v = -x * sa + y * ca, ns = N2.fbm(u / sl, v / sw, 3);
    const lf = .55 + .9 * N3(x / 160, y / 160); // some edges sweep far, some stay crisp
    let core = ss(.38, .62, s + (nf - .5) * rough);
    core *= 1 - .92 * c01(((1 - b) * bite + ns - 1.22) / .07) * ss(0, .25, 1 - b);
    const halo = c01((b * reach * lf + ns - 1.06) / .1) * c01(b * 5);
    const m = Math.max(core, halo * .95), j = i * 4;
    md[j] = md[j + 1] = md[j + 2] = 255; md[j + 3] = m * 255;
    rd[j] = rd[j + 1] = rd[j + 2] = 255; rd[j + 3] = halo * (1 - core) * 255;
    if (E) { ed[j] = 22; ed[j + 1] = 14; ed[j + 2] = 10; ed[j + 3] = core * (1 - ss(.5, .97, E[i] + (nf - .5) * .25)) * 255; } // pigment pooled at the wet edge
  }
  mask.getContext('2d').putImageData(mi, 0, 0); rim.getContext('2d').putImageData(ri, 0, 0);
  if (E) edge.getContext('2d').putImageData(ei, 0, 0);
  return { mask, rim, edge, B, A, w, h };
}
// tint an alpha canvas with a colour
function tint(src, rgb, a = 1) { const t = mkc(src.width, src.height), g = t.getContext('2d'); g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = css(rgb, a); g.fillRect(0, 0, t.width, t.height); return t; }

// Splatter: sprays of drops just outside the edge (gold) and flicks of dark ink inside it.
function splatter(c, ink, R, o) {
  const { B, A, w, h } = ink, drop = (x, y, r, col, a) => { c.fillStyle = css(col, a); c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); };
  let tries = 0, sprays = 0;
  while (sprays < (o.sprays || 26) && tries++ < 20000) {
    const x = R() * w, y = R() * h, i = (y | 0) * w + (x | 0), b = B[i];
    if (!(b > .05 && b < .3 && A[i] < .5)) continue;
    sprays++;
    const ang = R() * TAU, n = 6 + (R() * 22 | 0), spread = 10 + R() * 50, big = .8 + R() * 2.6;
    const col = R() < .78 ? C.goldHi : C.paper;
    for (let k = 0; k < n; k++) {
      const d = Math.abs(R() + R() - 1) * spread * 1.6, a2 = ang + (R() - .5) * 1.1, r = Math.max(.35, big * Math.pow(R(), 2.6) * (1 - d / (spread * 2)));
      const px = x + Math.cos(a2) * d, py = y + Math.sin(a2) * d;
      drop(px, py, r, col, .45 + R() * .5);
      if (r > 1.6 && R() < .5) { c.strokeStyle = css(col, .5); c.lineWidth = r * .7; c.lineCap = 'round'; c.beginPath(); c.moveTo(px, py); c.lineTo(px + Math.cos(a2) * r * 3, py + Math.sin(a2) * r * 3); c.stroke(); }
    }
  }
  for (let k = 0; k < (o.inside || 70); k++) { // dark flicks on the wash
    const x = R() * w, y = R() * h, i = (y | 0) * w + (x | 0);
    if (A[i] < .9) continue;
    const r = .5 + Math.pow(R(), 3) * 3.2; drop(x, y, r, [10, 9, 8], .35 + R() * .4);
  }
}

// watercolour blotches: a low-res noise field drawn as dark ink
function washTexture(w, h, seed, a = .32) {
  const sc = 4, tw = Math.ceil(w / sc), th = Math.ceil(h / sc), t = mkc(tw, th), g = t.getContext('2d'), id = g.createImageData(tw, th), N = makeNoise(seed);
  for (let y = 0; y < th; y++) for (let x = 0; x < tw; x++) {
    const n = N.fbm(x / 22, y / 22, 4), m = N(x / 3 + 50, y / 3) * .25, k = c01((n - .48) * 2.6) + m * .3, j = (y * tw + x) * 4;
    id.data[j] = 14; id.data[j + 1] = 10; id.data[j + 2] = 8; id.data[j + 3] = k * a * 255;
  }
  g.putImageData(id, 0, 0); return t;
}
function grainTile(seed) {
  const t = mkc(192, 192), g = t.getContext('2d'), id = g.createImageData(192, 192), R = rng(seed);
  for (let i = 0; i < 192 * 192; i++) { const v = R() * 255; id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 22; }
  g.putImageData(id, 0, 0); return t;
}

// A dry brush: bristles along a Catmull-Rom path through pts, breaking up at its flanks and toward its end.
function crPt(P, u) {
  const n = P.length - 1, i = Math.max(0, Math.min(n - 1, Math.floor(u))), f = u - i, a = P[Math.max(0, i - 1)], b = P[i], c = P[i + 1], d = P[Math.min(n, i + 2)];
  const k = (p0, p1, p2, p3) => .5 * (2 * p1 + (-p0 + p2) * f + (2 * p0 - 5 * p1 + 4 * p2 - p3) * f * f + (-p0 + 3 * p1 - 3 * p2 + p3) * f * f * f);
  return [k(a[0], b[0], c[0], d[0]), k(a[1], b[1], c[1], d[1])];
}
function brush(c, pts, wd, rgb, a, seed, o = {}) {
  const R = rng(seed), N = makeNoise(seed), steps = o.steps || 90, n = o.n || Math.min(70, Math.max(12, Math.round(wd / 2.6))), P = [];
  for (let i = 0; i <= steps; i++) P.push(crPt(pts, i / steps * (pts.length - 1)));
  const nrm = P.map((p, i) => { const q = P[Math.min(steps, i + 1)], r = P[Math.max(0, i - 1)], dx = q[0] - r[0], dy = q[1] - r[1], l = Math.hypot(dx, dy) || 1; return [-dy / l, dx / l]; });
  c.lineCap = 'round'; c.lineJoin = 'round';
  if (o.body) { // a wet body down the middle of a broad stroke, so only its flanks show bristles
    const half = (i, sd) => { const u = i / steps, press = .3 + .7 * Math.sin(Math.PI * Math.min(1, .04 + u * .98)); return [P[i][0] + nrm[i][0] * sd * .3 * wd * press, P[i][1] + nrm[i][1] * sd * .3 * wd * press]; };
    c.beginPath(); for (let i = 0; i <= steps * .8; i++) c.lineTo(...half(i, -1)); for (let i = Math.floor(steps * .8); i >= 0; i--) c.lineTo(...half(i, 1)); c.closePath();
    c.fillStyle = css(rgb, a * o.body); c.fill();
  }
  for (let j = 0; j < n; j++) {
    const off = j / (n - 1) - .5 + (R() - .5) / n, lw = wd / n * (1.4 + R() * 1.8), dry = o.dry ?? .7, lift = R() * .22;
    c.beginPath(); let on = false;
    for (let i = 0; i <= steps; i++) {
      const u = i / steps, press = o.taper === false ? 1 : .3 + .7 * Math.sin(Math.PI * Math.min(1, .04 + u * .98));
      const px = P[i][0] + nrm[i][0] * off * wd * press, py = P[i][1] + nrm[i][1] * off * wd * press;
      const inkv = N(j * 2.7 + 5, u * (o.gaps || 7)) + .55 - u * dry * .7 - Math.abs(off) * dry * .8 - lift;
      if (inkv > .5) { if (on) c.lineTo(px, py); else c.moveTo(px, py); on = true; } else on = false;
    }
    c.strokeStyle = css(rgb, a * (.45 + .55 * R()) * (1 - Math.abs(off) * .6)); c.lineWidth = lw; c.stroke();
  }
}

// ---------- painted silhouettes ----------
function vgrad(c, x, y, w, h, stops) { const g = c.createLinearGradient(0, y, 0, y + h); stops.forEach(([k, col]) => g.addColorStop(k, typeof col === 'string' ? col : css(col))); c.fillStyle = g; c.fillRect(x, y, w, h); }
function stars(c, x, y, w, h, n, R, a = 1) { for (let i = 0; i < n; i++) { const m = R(), s = .5 + m * m * 1.8; c.fillStyle = css([243, 234, 210], a * (.18 + .75 * m)); c.fillRect(x + R() * w, y + R() * h, s, s); } }
function clouds(c, x, y, w, h, R, rgb, n, a) { for (let i = 0; i < n; i++) { const r = (.12 + R() * .3) * w; glow(c, x + R() * w, y + R() * h, r, rgb, a * (.3 + R() * .7), r * (.18 + R() * .2)); } }
function ridge(c, x0, x1, y, amp, rgb, R, rough = .7) {
  c.fillStyle = css(rgb); c.beginPath(); c.moveTo(x0, y + amp * 3); let v = 0;
  const n = 40; for (let i = 0; i <= n; i++) { v = v * rough + (R() - .5) * amp; c.lineTo(x0 + (x1 - x0) * i / n, y - Math.abs(v) - amp * .4 * Math.sin(i * .45)); }
  c.lineTo(x1, y + amp * 3); c.closePath(); c.fill();
}
function palm(c, x, y, h, rgb, lean = 0) {
  const col = css(rgb); c.strokeStyle = col; c.fillStyle = col; c.lineCap = 'round';
  c.lineWidth = Math.max(1, h * .035); c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + h * (.08 + lean), y - h * .5, x + h * (.04 + lean * 1.4), y - h); c.stroke();
  const tx = x + h * (.04 + lean * 1.4), ty = y - h;
  for (let k = 0; k < 9; k++) { const a = -Math.PI / 2 + (k - 4) * .42; c.beginPath(); c.moveTo(tx, ty); c.quadraticCurveTo(tx + Math.cos(a) * h * .3, ty + Math.sin(a) * h * .3 - h * .06, tx + Math.cos(a) * h * .46, ty + Math.sin(a) * h * .46 + h * .14); c.quadraticCurveTo(tx + Math.cos(a) * h * .24, ty + Math.sin(a) * h * .2, tx, ty + h * .02); c.fill(); }
}
// Dhul-Fiqar: a curved blade whose tip splits in two. (bx,by) the guard, ang the blade's heading, L its length.
function dhulfiqar(c, bx, by, L, ang, o = {}) {
  const wB = L * (o.w || .1), bend = o.bend ?? .12;
  c.save(); c.translate(bx, by); c.rotate(ang);
  const cl = (v) => [bend * L * v * v, -L * v], hw = (v) => wB / 2 * (1 - .22 * v);
  const p = new Path2D(), e = (v, s) => { const [x, y] = cl(v); return [x + s * hw(v), y]; };
  p.moveTo(...e(0, -1));
  for (let v = 0; v <= .8; v += .04) p.lineTo(...e(v, -1));
  const tL = cl(1.0), tR = cl(.955), nb = cl(.84);
  p.quadraticCurveTo(tL[0] - hw(.9) * 1.1, tL[1] + L * .07, tL[0] - hw(1) * .55, tL[1]);
  p.lineTo(nb[0], nb[1]);
  p.lineTo(tR[0] + hw(1) * .75, tR[1]);
  p.quadraticCurveTo(tR[0] + hw(.9) * 1.2, tR[1] + L * .06, ...e(.8, 1));

    (g, t) => { const [p1x, p1y] = F(.235, .06), [p2x, p2y] = F(.125, .06); holyLight(g, p1x, p1y, 5.5 * U, t, { prophet: true }); holyLight(g, p2x, p2y, 5 * U, t, { ring: true, ph: 1.4 }); }, .6);
  // lam: Dhul-Fiqar against the night
  vig([.42, .02, .64, .62], (g, x, y, w, h, r) => {
    vgrad(g, x, y, w, h, [[0, [6, 9, 22]], [.4, [24, 32, 64]], [.75, [110, 74, 92]], [.92, [230, 150, 96]], [1, [255, 210, 150]]]); stars(g, x, y, w, h * .6, 70, r, 1);
    glow(g, x + w * .5, y + h * .3, w * .9, [120, 140, 200], .18, h * .3);
    const [gx, gy] = F(.535, .5); dhulfiqar(g, gx, gy, 285 * U, -.02, { bend: .1, w: .13 });
  }, (g, t) => { // a glint runs up the blade
    const k = (t / 4.2) % 1, [gx, gy] = F(.535, .5), yy = gy - 285 * U * mix(-.1, 1.15, ease(k));
    g.save(); g.globalCompositeOperation = 'lighter'; glow(g, gx + 6 * U, yy, 26 * U, [255, 240, 200], .55 * Math.sin(Math.PI * c01(k * 1.1)), 9 * U);
    if (k > .82) { const [tx2, ty2] = F(.55, .085); const a = Math.sin(Math.PI * (k - .82) / .18); glow(g, tx2, ty2, 16 * U * a, [255, 248, 225], .9 * a); g.strokeStyle = css([255, 246, 222], .7 * a); g.lineWidth = 1; g.beginPath(); g.moveTo(tx2 - 22 * U * a, ty2); g.lineTo(tx2 + 22 * U * a, ty2); g.moveTo(tx2, ty2 - 22 * U * a); g.lineTo(tx2, ty2 + 22 * U * a); g.stroke(); }
    g.restore();
  }, .4);
  // ain: the Kaaba at dusk, its wall split by a light
  vig([.6, .34, 1.03, .76], (g, x, y, w, h, r) => {
    vgrad(g, x, y, w, h, [[0, [52, 40, 80]], [.3, [150, 86, 100]], [.55, [246, 176, 110]], [.66, [255, 220, 160]], [.71, [80, 52, 44]], [1, [30, 22, 20]]]);
    glow(g, x + w * .3, y + h * .64, w * .5, [255, 230, 180], .6, h * .16);
    clouds(g, x, y + h * .2, w, h * .3, r, [255, 200, 150], 8, .3);
    ridge(g, x, x + w, y + h * .58, 7 * U, [74, 46, 58], r, .8); ridge(g, x, x + w, y + h * .63, 5 * U, [44, 30, 34], r, .7);
    const [kx, ky] = F(.79, .64); kaaba(g, kx, ky, 112 * U);
    for (let i = 0; i < 6; i++) palm(g, x + w * (.05 + i * .17 + r() * .05), y + h * .66, (26 + r() * 16) * U, [24, 16, 14]);
  }, (g, t) => { const [kx, ky] = F(.79, .64), s = 112 * U; const cx2 = kx + s * .5 + s * .2, cy2 = ky - s * .48; g.save(); g.globalCompositeOperation = 'lighter'; glow(g, cx2, cy2, s * .55, C.goldHi, .35 + .12 * Math.sin(t * 1.4), s * .7); g.restore(); holyLight(g, cx2, cy2, 3.6 * U, t, { ring: true, ph: .5 }); }, .8);
  // the bar, middle: riders of Badr under a dust-gold morning
  vig([.27, .55, .66, .76], (g, x, y, w, h, r) => { vgrad(g, x, y, w, h, [[0, [210, 150, 90]], [.55, [236, 190, 120]], [.75, [120, 80, 50]], [1, [40, 28, 22]]]); clouds(g, x, y + h * .2, w, h * .5, r, [255, 220, 170], 10, .4); },
    (g, t) => { const [x0, y0] = F(.27, .55), [x1, y1] = F(.66, .76); ridersLive(g, x0, y0, x1 - x0, y1 - y0, 62 * U, t, 6, 34 * U); }, .3);
  // ya, the leaf: the gate of Khaybar, its door rising and set down
  vig([.03, .2, .41, .74], (g, x, y, w, h, r) => {
    vgrad(g, x, y, w, h, [[0, [20, 24, 50]], [.28, [96, 70, 100]], [.5, [228, 150, 100]], [.66, [255, 214, 150]], [.73, [90, 60, 50]], [1, [30, 22, 22]]]);
    glow(g, x + w * .62, y + h * .64, w * .7, [255, 220, 160], .55, h * .2);
    stars(g, x, y, w, h * .35, 40, r, .7); clouds(g, x, y + h * .4, w, h * .25, r, [255, 190, 130], 8, .3);
    for (let i = 0; i < 7; i++) palm(g, x + w * (i / 6), y + h * .7, (24 + r() * 18) * U, [40, 30, 34], (r() - .5) * .1);
    fortress(g, x, y, w, h, U, r);
  }, (g, t) => { const [x0, y0] = F(.03, .2), [x1, y1] = F(.41, .74); khaybarLive(g, x0, y0, x1 - x0, y1 - y0, U, t); }, .9);
  // ya's tail: Siffin, the Euphrates and the banners
  vig([-.03, .68, .44, .9], (g, x, y, w, h, r) => {
    vgrad(g, x, y, w, h, [[0, [198, 150, 104]], [.32, [240, 204, 160]], [.42, [70, 66, 60]], [.48, [44, 70, 78]], [.8, [18, 36, 44]], [1, [12, 16, 20]]]);
    for (let i = 0; i < 12; i++) palm(g, x + w * (i / 11) + r() * 8, y + h * .42, (12 + r() * 10) * U, [44, 40, 38]);
  }, (g, t) => { const [x0, y0] = F(-.03, .68), [x1, y1] = F(.44, .9); siffinLive(g, x0, y0, x1 - x0, y1 - y0, U, t); }, .5);
  // the dots: Ghadir from above, and the mihrab at dawn
  vig([.145, .855, .29, 1.03], (g, x, y, w, h, r) => { const [cx2, cy2] = F(.215, .935); ghadirGround(g, cx2, cy2, w * .62, r); }, (g, t) => { const [cx2, cy2] = F(.215, .935); ghadirLive(g, cx2, cy2, 46 * U, t); }, .2);
  vig([.03, .855, .175, 1.03], (g, x, y, w, h, r) => { const [cx2, cy2] = F(.103, .935); mihrab(g, cx2, cy2, 52 * U); }, (g, t) => { const [cx2, cy2] = F(.103, .935); mihrabLive(g, cx2, cy2, 52 * U, t); }, .2);
  // bake: wash blotches and dark flicks over the painting, the gold rim, the spray
  const wash = washTexture(mw, mh, 3, .3);
  const rimGold = tint(ink.rim, [214, 170, 92], 1);
  const spl = mkc(mw * dpr, mh * dpr), sp = spl.getContext('2d'); sp.scale(dpr, dpr); splatter(sp, ink, rng(9), { sprays: port ? 40 : 60, inside: 160 });
  // background: night, a warm bloom behind the word, faint vellum grain
  const bg = mkc(W * dpr, H * dpr), b = bg.getContext('2d'); b.scale(dpr, dpr);
  vgrad(b, 0, 0, W, H, [[0, [9, 13, 26]], [.6, [12, 14, 20]], [1, [8, 9, 12]]]);
  glow(b, W / 2, by + bh * .55, Math.max(W, H) * .55, [120, 84, 50], .35, Math.max(W, H) * .42);
  const wt = washTexture(W, H, 21, .5); b.globalAlpha = .7; b.drawImage(wt, 0, 0, W, H); b.globalAlpha = 1;
  stars(b, 0, 0, W, H, 140, rng(2), .35);
  // big dry-brush sweeps behind the word, and an open ring of gold around it
  const cxw = bx + bw / 2, cyw = by + bh * .5, rr = Math.min(Math.max(bw, bh) * .62, port ? W * .62 : H * .5);
  brush(b, [[bx - bw * .25, cyw + bh * .45], [cxw - bw * .1, cyw + bh * .05], [cxw + bw * .3, cyw - bh * .25], [bx + bw * 1.3, by - bh * .05]], bh * .55, [30, 40, 70], .5, 3, { dry: .55, body: .5 });
  brush(b, [[bx - bw * .1, by + bh * 1.08], [cxw, by + bh * 1.04], [bx + bw * 1.15, by + bh * .98]], bh * .07, [150, 112, 56], .45, 8, { dry: .9 });
  const ens = []; for (let i = 0; i <= 12; i++) { const a = 2.75 - i / 12 * 3.9; ens.push([cxw + Math.cos(a) * rr * 1.05, cyw + bh * .04 + Math.sin(a) * rr * .92]); }
  brush(b, ens, Math.max(16, bh * .06), [176, 136, 62], .7, 12, { dry: .75, gaps: 8, steps: 200 });
  if (port) { brush(b, [[-20, H * .1], [W * .5, H * .06], [W + 20, H * .12]], H * .05, [30, 40, 70], .5, 21); brush(b, [[-20, H * .93], [W * .4, H * .86], [W + 20, H * .9]], H * .08, [36, 44, 70], .5, 22); }
  // the ain's crown: where the riders stand
  const crown = []; for (let fx = .68; fx <= .88; fx += .01) { const px = Math.round(bx + fx * bw - ox); let yy = -1; for (let py = Math.round(by + .3 * bh - oy); py < Math.round(by + .62 * bh - oy); py++) if (ink.A[py * mw + px] > .5) { yy = py + oy; break; } crown.push([px + ox, yy]); }
  S = { W, H, dpr, port, ox, oy, mw, mh, lay, lg, base, V, wash, ink, rimGold, spl, bg, grain: grainTile(4), F, U, bw, bh, bx, by, crown,
    birds: Array.from({ length: 8 }, (_, i) => ({ ph: i / 8, sp: .045 + hash(i) * .03, a: hash(i, 2), sz: .7 + hash(i, 3) * .6, dir: i % 3 ? -1 : 1 })),
    motes: Array.from({ length: 70 }, (_, i) => [hash(i, 5), hash(i, 6), .3 + hash(i, 7), hash(i, 8)]) };
  layoutText();
}

function layoutText() {
  const { F, port, W, H, bh, by } = S;
  const [, sy] = F(0, 1.02);
  document.documentElement.style.setProperty('--sub-y', `${Math.min(H - 60, sy + (port ? 6 : 2))}px`);
  if (port) {
    const top = sy + 64; quote.style.setProperty('--q-l', `${W * .06}px`); quote.style.setProperty('--q-t', `${top}px`); quote.style.setProperty('--q-w', `${W * .88}px`); quote.style.setProperty('--q-fs', `${Math.min(30, W * .075)}px`);
  } else {
    const [qx0, qy0] = F(.43, .76), [qx1] = F(1.05, 0);
    quote.style.setProperty('--q-l', `${qx0}px`); quote.style.setProperty('--q-t', `${qy0}px`); quote.style.setProperty('--q-w', `${qx1 - qx0}px`); quote.style.setProperty('--q-fs', `${Math.min(40, bh * .058)}px`);
  }
}

function frame(t) {
  const s = S; if (!s) return;
  const { W, H, dpr, ox, oy, mw, mh, lg, lay, F, U } = s;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(s.bg, 0, 0);
  // the painting, through the word
  lg.setTransform(1, 0, 0, 1, 0, 0); lg.globalCompositeOperation = 'source-over'; lg.clearRect(0, 0, lay.width, lay.height);
  lg.drawImage(s.base, Math.sin(t * .2) * 3 * dpr, 0);
  lg.setTransform(dpr, 0, 0, dpr, -ox * dpr, -oy * dpr);
  drawVignettes(lg, s.V, t);
  lg.setTransform(1, 0, 0, 1, 0, 0);
  lg.drawImage(s.wash, 0, 0, lay.width, lay.height);
  lg.globalAlpha = .75; lg.drawImage(s.ink.edge, 0, 0, lay.width, lay.height); lg.globalAlpha = 1;
  lg.globalCompositeOperation = 'destination-in'; lg.drawImage(s.ink.mask, 0, 0, lay.width, lay.height);
  lg.globalCompositeOperation = 'source-over';
  ctx.drawImage(lay, ox * dpr, oy * dpr);
  // gold pigment where the brush ran dry, breathing a little
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .38 + .08 * Math.sin(t * .7); ctx.drawImage(s.rimGold, ox * dpr, oy * dpr, mw * dpr, mh * dpr); ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(s.spl, ox * dpr, oy * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // riders on the crown of the ain, in their own dust
  const cr = s.crown.filter((p) => p[1] > 0);
  if (cr.length > 4) {
    const rs = 60 * U;
    [[.18, 1, 0], [.45, .92, 2.1], [.72, .84, 4.2]].forEach(([fu, sc, ph], i) => {
      const drift = Math.sin(t * .5 + i * 1.3) * 6 * U, k = Math.min(cr.length - 1, Math.max(0, Math.round(fu * (cr.length - 1)))), [gx, gy] = cr[k];
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; glow(ctx, gx + drift + rs * .6, gy - rs * .45, rs * 1.3, [230, 170, 100], .42 + .1 * Math.sin(t * 1.7 + i), rs * .6); ctx.restore();
      rider(ctx, gx + drift, gy + 1, rs * sc, t * 8.5 + ph, { col: 'rgb(16,12,10)', rim: [-.8, -.8], rimCol: 'rgba(255,214,150,.85)', tip: '#f3d98f' });
    });
  }
  if (s.port) { // a frieze of riders crossing the foot of the screen
    const gy = H * .91, rs = 40 * U * 1.6;
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; glow(ctx, W * .5, gy - rs * .35, W * .75, [230, 160, 90], .55 + .08 * Math.sin(t * 1.3), rs * .75); ctx.restore();
    for (let i = 0; i < 5; i++) { const span = W + rs * 4, u = (t * .045 + i / 5) % 1, x = W + rs * 1.5 - u * span; rider(ctx, x, gy + (i % 2) * 5, rs * (i % 2 ? .85 : 1), t * 8.5 + i * 1.7, { col: 'rgb(14,11,10)', rim: [-.7, -.7], rimCol: 'rgba(255,214,150,.8)', tip: '#f3d98f' }); }
  }
  // doves leaving the shadda
  const [sx, sy] = F(.2, .02);
  s.birds.forEach((b, i) => {
    const k = (t * b.sp + b.ph) % 1, x = sx + b.dir * k * s.bw * (.25 + b.a * .3), y = sy + 20 * U - k * Math.max(140, s.by + 120) * (.7 + b.a * .5) + Math.sin(k * 7 + i) * 10 * U;
    const a = Math.min(1, k * 6) * (1 - ss(.7, 1, k));
    dove(ctx, x, y, (10 + 7 * b.sz) * U * (1 + k * .7), t * (2.4 + b.a) + i * .3, C.paper, .9 * a, b.dir);
  });
  // gold dust rising
  ctx.globalCompositeOperation = 'lighter';
  s.motes.forEach(([mx, my, sp, ph]) => { const y = ((my - t * .012 * sp) % 1 + 1) % 1, x = mx + Math.sin(t * .4 + ph * 9) * .01; glow(ctx, x * W, y * H, 2.2 + sp * 2, C.goldHi, .35 * Math.sin(Math.PI * y)); });
  ctx.globalCompositeOperation = 'source-over';
  finish(ctx, cv, s.grain, t);
}

boot([[`700 100px ${FONT}`, WORD], ['700 40px "Aref Ruqaa"', 'لا سيف إلا ذو الفقار'], ['400 20px "Reem Kufi"', 'ابن أبي طالب']], build, frame);
</script>
