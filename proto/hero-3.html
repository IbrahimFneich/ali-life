<!doctype html>
<html lang="ar" dir="rtl">

<style>
:root {
  --ink: #0d0e0b; --ink2: #16180f; --night: #070b16; --paper: #e6dcc3; --paper-dim: #b9ad90;
  --gold: #c9a54e; --gold-hi: #f3d98f; --green: #2e7558; --green-hi: #79c9a2; --blood: #a4322b; --sand: #c2a576;
  --fg: #ebe3cf; --fg-dim: #a59c86;
  --f-kufi: "Reem Kufi", "Noto Kufi Arabic", "Geeza Pro", sans-serif;
  --f-naskh: Amiri, "Noto Naskh Arabic", "Geeza Pro", serif;
  --f-ruqaa: "Aref Ruqaa", Amiri, serif;
  --f-ui: "IBM Plex Sans Arabic", "Geeza Pro", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--night); color: var(--fg); overflow: hidden; }
.hero { position: relative; width: 100vw; height: 100vh; height: 100svh; overflow: hidden; background: var(--night); }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.meta { position: absolute; z-index: 2; top: calc(env(safe-area-inset-top, 0px) + 22px); right: max(16px, env(safe-area-inset-right, 0px)); margin: 0; display: flex; gap: .7rem; font: 500 .8rem var(--f-ui); color: var(--gold); }
.meta i { font-style: normal; opacity: .6; }
.name { position: absolute; z-index: 2; margin: 0; inset-inline: 0; top: var(--n-y, 50%); text-align: center; display: grid; justify-items: center; gap: .2rem; pointer-events: none; }
.name-a { font-family: var(--f-ruqaa); font-weight: 700; font-size: var(--n-fs, 8rem); line-height: 1.05; color: var(--gold-hi); text-shadow: 0 0 60px rgba(243, 217, 143, .35), 0 4px 30px rgba(7, 11, 22, .9); }
.name-b { font: 400 clamp(1rem, 2.4vmin, 1.5rem) var(--f-kufi); color: var(--fg); text-shadow: 0 2px 18px rgba(7, 11, 22, .95); }
.quote { position: absolute; z-index: 2; margin: 0; inset-inline: 0; top: var(--q-y, 70%); text-align: center; transform: rotate(-2.5deg); pointer-events: none; }
.quote blockquote { margin: 0; font: 700 var(--q-fs, 2.4rem)/1.3 var(--f-ruqaa); color: var(--paper); text-shadow: 0 0 1px rgba(243, 217, 143, .6), 0 3px 22px rgba(7, 11, 22, .95), 0 0 40px rgba(7, 11, 22, .8); }
.quote figcaption { margin-top: .25rem; font: 400 .72rem/1.6 var(--f-ui); color: var(--gold); text-shadow: 0 1px 10px rgba(7, 11, 22, .95); }
.back { position: absolute; z-index: 3; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); font: 400 .72rem var(--f-ui); color: var(--fg-dim); text-decoration: none; }
.back:hover { color: var(--gold-hi); }
</style>
<style>.embed .back, .embed .meta { display: none; }</style>
<script>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add('embed');</script>

<body>
<header class="hero" id="hero">
  <canvas id="cv" aria-hidden="true"></canvas>

  <h1 class="name" id="name"><span class="name-a">عليّ</span><span class="name-b">ابن أبي طالب عليه السلام</span></h1>
  <figure class="quote" id="quote">
    <blockquote>«مَن كنتُ مولاه فهذا عليٌّ مولاه…»</blockquote>
    <figcaption>الإرشاد للشيخ المفيد ١:١٧٦</figcaption>
  </figure>
  <a class="back" href="hero.html">النماذج الثلاثة</a>
</header>
<script src="../scenes/holy.js"></script>
<script>
/*LIB:BEGIN — shared by hero-1/2/3; keep in sync */
const TAU = Math.PI * 2;
const c01 = (v) => Math.min(1, Math.max(0, v));
const mix = (a, b, k) => a + (b - a) * k;
const smooth = (t) => t * t * (3 - 2 * t);
const ss = (a, b, v) => smooth(c01((v - a) / (b - a)));
const rng = (seed) => () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const hash = (i, s = 0) => { const v = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return v - Math.floor(v); };
const css = (a, al = 1) => `rgba(${a[0] | 0},${a[1] | 0},${a[2] | 0},${al})`;
const mixc = (a, b, k) => [mix(a[0], b[0], k), mix(a[1], b[1], k), mix(a[2], b[2], k)];
const C = { // the site palette (styles.css :root) as rgb
  ink: [13, 14, 11], ink2: [22, 24, 15], night: [7, 11, 22], dusk: [27, 36, 64], paper: [230, 220, 195], paperDim: [185, 173, 144],
  gold: [201, 165, 78], goldHi: [243, 217, 143], green: [46, 117, 88], greenHi: [121, 201, 162], blood: [164, 50, 43], sand: [194, 165, 118],
  white: [255, 246, 222], clay: [138, 106, 69],
};
function mkc(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }

// value noise on a 256 lattice, and fractal sums of it
function makeNoise(seed) {
  const R = rng(seed), N = 256, g = new Float32Array(N * N);
  for (let i = 0; i < N * N; i++) g[i] = R();
  const n = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y); let fx = x - xi, fy = y - yi;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
    const a = g[y0 * N + x0], b = g[y0 * N + x1], c = g[y1 * N + x0], d = g[y1 * N + x1];
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  };
  n.fbm = (x, y, o) => { let s = 0, amp = .5, f = 1, nm = 0; for (let i = 0; i < o; i++) { s += amp * n(x * f + i * 17.3, y * f + i * 9.1); nm += amp; amp *= .5; f *= 2.03; } return s / nm; };
  return n;
}
function blurPass(s, d, w, h, r, horiz) {
  const iv = 1 / (2 * r + 1), L = horiz ? w : h, M = horiz ? h : w, st = horiz ? 1 : w, so = horiz ? w : 1;
  for (let m = 0; m < M; m++) {
    const o = m * so; let acc = 0;
    for (let k = -r; k <= r; k++) acc += s[o + Math.min(L - 1, Math.max(0, k)) * st];
    for (let k = 0; k < L; k++) { d[o + k * st] = acc * iv; acc += s[o + Math.min(L - 1, k + r + 1) * st] - s[o + Math.max(0, k - r) * st]; }
  }
}
function boxBlur(src, w, h, r) { // three box passes ≈ a gaussian
  r = Math.max(1, Math.round(r)); const a = Float32Array.from(src), b = new Float32Array(w * h);
  for (let p = 0; p < 3; p++) { blurPass(a, b, w, h, r, true); blurPass(b, a, w, h, r, false); }
  return a;
}

// glow sprites: one baked radial gradient per colour, drawn scaled
const SPR = {};
function sprite(rgb) {
  const k = rgb.join(); if (SPR[k]) return SPR[k];
  const s = mkc(128, 128), g = s.getContext('2d'), q = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  [[0, 1], [.12, .72], [.3, .3], [.55, .09], [.8, .02], [1, 0]].forEach(([o, a]) => q.addColorStop(o, css(rgb, a)));
  g.fillStyle = q; g.fillRect(0, 0, 128, 128); return (SPR[k] = s);
}
function glow(c, x, y, r, rgb, a, ry) { if (a <= 0 || r <= 0) return; c.globalAlpha = Math.min(1, a); c.drawImage(sprite(rgb), x - r, y - (ry || r), 2 * r, 2 * (ry || r)); c.globalAlpha = 1; }

// The five of the Kisa are veiled figures (scenes/holy.js, loaded before this script): the face is never drawn, a
// white veil hangs from under the turban, a flat gold disc stands behind the head. holy() draws one, with a soft warm
// bloom at the disc. Everyone else stays a faceless silhouette.
function holy(c, o, bloom = 1) {
  const hd = Holy.draw(c, { t: 0, amb: .6, ...o });
  if (hd && bloom > 0) { c.save(); c.globalCompositeOperation = 'lighter'; glow(c, hd.x, hd.y, hd.r * 5.5, C.goldHi, .3 * bloom * (o.alpha ?? 1)); c.restore(); }
  return hd;
}
// The newborn at the Kaaba («ثم خرجت بعد الرابع وبيدها أمير المؤمنين»): Fatima bint Asad, a faceless dark silhouette (she is not
// one of the five), holds him at her breast; he is a white swaddled bundle, the face wrapped, with a small gold disc
// behind his head in holy.js's colours. (x, y) is her ground point, h her height.
function newborn(c, x, y, h, t, a = 1) {
  if (!(h > 0) || a <= 0) return;
  const sw = Math.sin(t * .8) * h * .006, hy = y - h * .9;
  c.save(); c.globalAlpha *= a;
  c.beginPath(); c.moveTo(x - h * .05, hy - h * .07); // her chador, from the head to the ground
  c.quadraticCurveTo(x - h * .12, hy - h * .05, x - h * .13, hy + h * .1);
  c.bezierCurveTo(x - h * .2, y - h * .45, x - h * .22 + sw, y - h * .15, x - h * .24 + sw, y);
  c.lineTo(x + h * .24 + sw, y);
  c.bezierCurveTo(x + h * .22 + sw, y - h * .15, x + h * .2, y - h * .45, x + h * .13, hy + h * .1);
  c.quadraticCurveTo(x + h * .12, hy - h * .05, x + h * .05, hy - h * .07);
  c.quadraticCurveTo(x, hy - h * .1, x - h * .05, hy - h * .07); c.closePath();
  const q = c.createLinearGradient(x - h * .24, 0, x + h * .24, 0); q.addColorStop(0, '#120e14'); q.addColorStop(1, '#2c2129');
  c.fillStyle = q; c.fill(); c.strokeStyle = 'rgba(255,214,150,.45)'; c.lineWidth = Math.max(.8, h * .008); c.stroke();
  const bx = x + h * .01, by = y - h * .57, hx = bx + h * .13, hb = by - h * .045, R = h * .09; // the bundle, his head to the right
  const dq = c.createRadialGradient(hx, hb, 0, hx, hb, R); dq.addColorStop(0, '#f8e6a8'); dq.addColorStop(.72, '#d9ad52'); dq.addColorStop(1, '#a87c2c');
  c.beginPath(); c.arc(hx, hb, R, 0, TAU); c.fillStyle = dq; c.fill(); c.strokeStyle = '#fbe7ad'; c.lineWidth = Math.max(.6, R * .06); c.stroke();
  const wq = c.createLinearGradient(0, by - h * .05, 0, by + h * .05); wq.addColorStop(0, '#fbf6ea'); wq.addColorStop(1, '#d8cfbc'); c.fillStyle = wq;
  c.beginPath(); c.ellipse(bx, by, h * .17, h * .06, -.28, 0, TAU); c.fill();
  c.beginPath(); c.arc(hx, hb, h * .052, 0, TAU); c.fill(); // the wrapped head
  c.fillStyle = '#251b22'; c.beginPath(); c.ellipse(bx - h * .02, by + h * .045, h * .18, h * .035, -.2, 0, Math.PI); c.fill(); // her sleeves under him
  c.restore();
  c.save(); c.globalCompositeOperation = 'lighter'; glow(c, hx, hb, R * 4, C.goldHi, .3 * a); c.restore();
}

// Ink wash: a crisp silhouette (alpha) becomes a window with a roughened edge and a dissolving dry-brush halo.
// Returns {mask, rim}: mask = where the painting shows, rim = the dry-brush strokes outside the crisp edge.
function inkify(shape, o) {
  const w = shape.width, h = shape.height, d = shape.getContext('2d').getImageData(0, 0, w, h).data, n = w * h;
  const A = new Float32Array(n); for (let i = 0; i < n; i++) A[i] = d[i * 4 + 3] / 255;
  const S = boxBlur(A, w, h, o.fine || 1), B = boxBlur(A, w, h, o.spread || 20), E = o.edge ? boxBlur(A, w, h, o.edge) : null;
  const N1 = makeNoise(o.seed || 1), N2 = makeNoise((o.seed || 1) + 7), N3 = makeNoise((o.seed || 1) + 13);
  const ca = Math.cos(o.angle || 0), sa = Math.sin(o.angle || 0);
  const mask = mkc(w, h), rim = mkc(w, h), mi = mask.getContext('2d').createImageData(w, h), ri = rim.getContext('2d').createImageData(w, h);
  const edge = E ? mkc(w, h) : null, ei = E ? edge.getContext('2d').createImageData(w, h) : null, ed = ei && ei.data;
  const md = mi.data, rd = ri.data, grain = o.grain || 2.4, rough = o.rough ?? .55, reach = o.reach ?? 1.75, sl = o.streakL || 70, sw = o.streakW || 1.7, bite = o.bite ?? 1.1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x, b = B[i], s = S[i];
    if (b < .012 && s < .01) continue;
    const nf = N1.fbm(x / grain, y / grain, 2);
    const u = x * ca + y * sa, v = -x * sa + y * ca, ns = N2.fbm(u / sl, v / sw, 3);
    const lf = .55 + .9 * N3(x / 160, y / 160); // some edges sweep far, some stay crisp
    let core = ss(.38, .62, s + (nf - .5) * rough);
    core *= 1 - .92 * c01(((1 - b) * bite + ns - 1.22) / .07) * ss(0, .25, 1 - b);
    const halo = c01((b * reach * lf + ns - 1.06) / .1) * c01(b * 5);
    const m = Math.max(core, halo * .95), j = i * 4;
    md[j] = md[j + 1] = md[j + 2] = 255; md[j + 3] = m * 255;
    rd[j] = rd[j + 1] = rd[j + 2] = 255; rd[j + 3] = halo * (1 - core) * 255;
    if (E) { ed[j] = 22; ed[j + 1] = 14; ed[j + 2] = 10; ed[j + 3] = core * (1 - ss(.5, .97, E[i] + (nf - .5) * .25)) * 255; } // pigment pooled at the wet edge
  }
  mask.getContext('2d').putImageData(mi, 0, 0); rim.getContext('2d').putImageData(ri, 0, 0);
  if (E) edge.getContext('2d').putImageData(ei, 0, 0);
  return { mask, rim, edge, B, A, w, h };
}
// tint an alpha canvas with a colour
function tint(src, rgb, a = 1) { const t = mkc(src.width, src.height), g = t.getContext('2d'); g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = css(rgb, a); g.fillRect(0, 0, t.width, t.height); return t; }

// Splatter: sprays of drops just outside the edge (gold) and flicks of dark ink inside it.
function splatter(c, ink, R, o) {
  const { B, A, w, h } = ink, drop = (x, y, r, col, a) => { c.fillStyle = css(col, a); c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); };
  let tries = 0, sprays = 0;
  while (sprays < (o.sprays || 26) && tries++ < 20000) {
    const x = R() * w, y = R() * h, i = (y | 0) * w + (x | 0), b = B[i];
    if (!(b > .05 && b < .3 && A[i] < .5)) continue;
    sprays++;
    const ang = R() * TAU, n = 6 + (R() * 22 | 0), spread = 10 + R() * 50, big = .8 + R() * 2.6;
    const col = R() < .78 ? C.goldHi : C.paper;
    for (let k = 0; k < n; k++) {
      const d = Math.abs(R() + R() - 1) * spread * 1.6, a2 = ang + (R() - .5) * 1.1, r = Math.max(.35, big * Math.pow(R(), 2.6) * (1 - d / (spread * 2)));
      const px = x + Math.cos(a2) * d, py = y + Math.sin(a2) * d;
      drop(px, py, r, col, .45 + R() * .5);
      if (r > 1.6 && R() < .5) { c.strokeStyle = css(col, .5); c.lineWidth = r * .7; c.lineCap = 'round'; c.beginPath(); c.moveTo(px, py); c.lineTo(px + Math.cos(a2) * r * 3, py + Math.sin(a2) * r * 3); c.stroke(); }
    }
  }
  for (let k = 0; k < (o.inside || 70); k++) { // dark flicks on the wash
    const x = R() * w, y = R() * h, i = (y | 0) * w + (x | 0);
    if (A[i] < .9) continue;
    const r = .5 + Math.pow(R(), 3) * 3.2; drop(x, y, r, [10, 9, 8], .35 + R() * .4);
  }
}

// watercolour blotches: a low-res noise field drawn as dark ink
function washTexture(w, h, seed, a = .32) {
  const sc = 4, tw = Math.ceil(w / sc), th = Math.ceil(h / sc), t = mkc(tw, th), g = t.getContext('2d'), id = g.createImageData(tw, th), N = makeNoise(seed);
  for (let y = 0; y < th; y++) for (let x = 0; x < tw; x++) {
    const n = N.fbm(x / 22, y / 22, 4), m = N(x / 3 + 50, y / 3) * .25, k = c01((n - .48) * 2.6) + m * .3, j = (y * tw + x) * 4;
    id.data[j] = 14; id.data[j + 1] = 10; id.data[j + 2] = 8; id.data[j + 3] = k * a * 255;
  }
  g.putImageData(id, 0, 0); return t;
}
function grainTile(seed) {
  const t = mkc(192, 192), g = t.getContext('2d'), id = g.createImageData(192, 192), R = rng(seed);
  for (let i = 0; i < 192 * 192; i++) { const v = R() * 255; id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 22; }
  g.putImageData(id, 0, 0); return t;
}

// A dry brush: bristles along a Catmull-Rom path through pts, breaking up at its flanks and toward its end.
function crPt(P, u) {
  const n = P.length - 1, i = Math.max(0, Math.min(n - 1, Math.floor(u))), f = u - i, a = P[Math.max(0, i - 1)], b = P[i], c = P[i + 1], d = P[Math.min(n, i + 2)];
  const k = (p0, p1, p2, p3) => .5 * (2 * p1 + (-p0 + p2) * f + (2 * p0 - 5 * p1 + 4 * p2 - p3) * f * f + (-p0 + 3 * p1 - 3 * p2 + p3) * f * f * f);
  return [k(a[0], b[0], c[0], d[0]), k(a[1], b[1], c[1], d[1])];
}
function brush(c, pts, wd, rgb, a, seed, o = {}) {
  const R = rng(seed), N = makeNoise(seed), steps = o.steps || 90, n = o.n || Math.min(70, Math.max(12, Math.round(wd / 2.6))), P = [];
  for (let i = 0; i <= steps; i++) P.push(crPt(pts, i / steps * (pts.length - 1)));
  const nrm = P.map((p, i) => { const q = P[Math.min(steps, i + 1)], r = P[Math.max(0, i - 1)], dx = q[0] - r[0], dy = q[1] - r[1], l = Math.hypot(dx, dy) || 1; return [-dy / l, dx / l]; });
  c.lineCap = 'round'; c.lineJoin = 'round';
  if (o.body) { // a wet body down the middle of a broad stroke, so only its flanks show bristles
    const half = (i, sd) => { const u = i / steps, press = .3 + .7 * Math.sin(Math.PI * Math.min(1, .04 + u * .98)); return [P[i][0] + nrm[i][0] * sd * .3 * wd * press, P[i][1] + nrm[i][1] * sd * .3 * wd * press]; };
    c.beginPath(); for (let i = 0; i <= steps * .8; i++) c.lineTo(...half(i, -1)); for (let i = Math.floor(steps * .8); i >= 0; i--) c.lineTo(...half(i, 1)); c.closePath();
    c.fillStyle = css(rgb, a * o.body); c.fill();
  }
  for (let j = 0; j < n; j++) {
    const off = j / (n - 1) - .5 + (R() - .5) / n, lw = wd / n * (1.4 + R() * 1.8), dry = o.dry ?? .7, lift = R() * .22;
    c.beginPath(); let on = false;
    for (let i = 0; i <= steps; i++) {
      const u = i / steps, press = o.taper === false ? 1 : .3 + .7 * Math.sin(Math.PI * Math.min(1, .04 + u * .98));
      const px = P[i][0] + nrm[i][0] * off * wd * press, py = P[i][1] + nrm[i][1] * off * wd * press;
      const inkv = N(j * 2.7 + 5, u * (o.gaps || 7)) + .55 - u * dry * .7 - Math.abs(off) * dry * .8 - lift;
      if (inkv > .5) { if (on) c.lineTo(px, py); else c.moveTo(px, py); on = true; } else on = false;
    }
    c.strokeStyle = css(rgb, a * (.45 + .55 * R()) * (1 - Math.abs(off) * .6)); c.lineWidth = lw; c.stroke();
  }
}

// ---------- painted silhouettes ----------
function vgrad(c, x, y, w, h, stops) { const g = c.createLinearGradient(0, y, 0, y + h); stops.forEach(([k, col]) => g.addColorStop(k, typeof col === 'string' ? col : css(col))); c.fillStyle = g; c.fillRect(x, y, w, h); }
function stars(c, x, y, w, h, n, R, a = 1) { for (let i = 0; i < n; i++) { const m = R(), s = .5 + m * m * 1.8; c.fillStyle = css([243, 234, 210], a * (.18 + .75 * m)); c.fillRect(x + R() * w, y + R() * h, s, s); } }
function clouds(c, x, y, w, h, R, rgb, n, a) { for (let i = 0; i < n; i++) { const r = (.12 + R() * .3) * w; glow(c, x + R() * w, y + R() * h, r, rgb, a * (.3 + R() * .7), r * (.18 + R() * .2)); } }

// is ever drawn), a radiance behind him; and around him
// the scenes of his life gathered in pools of ink, the way the posters gather a director's films around his head.
// Threads of light run out from the centre to each scene; smoke drifts; every scene keeps its own small motion.
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), hero = document.getElementById('hero');
let S = null;

// [key, cx, cy, w, h] as fractions of the screen; landscape and portrait
const LAND = { light: [.5, .34], name: .43, quote: .675,
  blobs: [['riders', .5, .1, .34, .17], ['kaaba', .79, .2, .21, .27], ['khaybar', .865, .53, .2, .33], ['kufa', .75, .81, .19, .28], ['ghadir', .5, .875, .32, .18], ['siffin', .25, .8, .22, .26], ['dhulfiqar', .135, .5, .17, .42], ['mabit', .22, .19, .22, .22]] };
const PORT = { light: [.5, .33], name: .385, quote: .565,
  blobs: [['riders', .5, .13, .9, .1], ['kaaba', .79, .265, .38, .13], ['mabit', .21, .265, .4, .1], ['dhulfiqar', .12, .43, .22, .19], ['khaybar', .87, .44, .24, .15], ['siffin', .25, .755, .46, .13], ['kufa', .77, .755, .42, .13], ['ghadir', .5, .875, .86, .115]] };

const PAINT = {
  riders: { p(g, x, y, w, h, r) { vgrad(g, x, y, w, h, [[0, [120, 90, 100]], [.35, [226, 160, 100]], [.62, [250, 206, 140]], [.8, [110, 74, 50]], [1, [36, 26, 22]]]); clouds(g, x, y + h * .2, w, h * .4, r, [255, 220, 170], 10, .45); ridge(g, x, x + w, y + h * .66, h * .05, [140, 96, 80], r, .8); },
    l(g, x, y, w, h, t) { ridersLive(g, x, y, w, h, h * .45, t, 5, 32 * h / 150, .82); } },
  kaaba: { p(g, x, y, w, h, r) { vgrad(g, x, y, w, h, [[0, [40, 34, 70]], [.3, [140, 80, 96]], [.56, [246, 176, 110]], [.66, [255, 220, 160]], [.71, [80, 52, 44]], [1, [30, 22, 20]]]); clouds(g, x, y + h * .2, w, h * .3, r, [255, 200, 150], 6, .3); ridge(g, x, x + w, y + h * .62, h * .03, [74, 46, 58], r, .8); kaaba(g, x + w * .44, y + h * .74, h * .4); for (let i = 0; i < 5; i++) palm(g, x + w * (.05 + i * .22), y + h * .72, h * (.12 + r() * .08), [24, 16, 14]); },
    l(g, x, y, w, h, t) { const s = h * .4, kx = x + w * .44 + s * .95 / 2 + s * .2, ky = y + h * .74 - s * .48; g.save(); g.globalCompositeOperation = 'lighter'; glow(g, kx, ky, s * .6, C.goldHi, .35 + .12 * Math.sin(t * 1.4), s * .7); g.restore(); newborn(g, kx, ky + s * .48 + s * .02, s * .48, t); } },
  khaybar: { p(g, x, y, w, h, r) { vgrad(g, x, y, w, h, [[0, [20, 24, 50]], [.28, [96, 70, 100]], [.5, [228, 150, 100]], [.66, [255, 214, 150]], [.73, [90, 60, 50]], [1, [30, 22, 22]]]); stars(g, x, y, w, h * .3, 30, r, .7); for (let i = 0; i < 6; i++) palm(g, x + w * (i / 5), y + h * .7, h * (.07 + r() * .05), [40, 30, 34]); fortress(g, x, y, w, h, h / 380, r); },
    l(g, x, y, w, h, t) { khaybarLive(g, x, y, w, h, h / 380, t); } },
  kufa: { p(g, x, y, w, h, r) { kufa(g, x, y, w, h, h / 190, r); }, l(g, x, y, w, h, t) { kufaLive(g, x, y, w, h, h / 190, t); } },
  ghadir: { p(g, x, y, w, h, r) { ghadirSide(g, x, y, w, h, h / 100, r); }, l(g, x, y, w, h, t) { ghadirSideLive(g, x, y, w, h, h / 100, t); } },
  siffin: { p(g, x, y, w, h, r) { vgrad(g, x, y, w, h, [[0, [198, 150, 104]], [.32, [240, 204, 160]], [.42, [70, 66, 60]], [.48, [44, 70, 78]], [.8, [18, 36, 44]], [1, [12, 16, 20]]]); glow(g, x + w * .6, y + h * .3, w * .4, [255, 236, 200], .5, h * .15); for (let i = 0; i < 12; i++) palm(g, x + w * (i / 11) + r() * 8, y + h * .42, h * (.08 + r() * .06), [44, 40, 38]); },
    l(g, x, y, w, h, t) { siffinLive(g, x, y, w, h, h / 160, t); } },
  dhulfiqar: { p(g, x, y, w, h, r) { vgrad(g, x, y, w, h, [[0, [6, 9, 22]], [.4, [24, 32, 64]], [.75, [120, 80, 96]], [.92, [236, 160, 100]], [1, [255, 214, 150]]]); stars(g, x, y, w, h * .6, 60, r, 1); glow(g, x + w * .5, y + h * .4, w * .8, [120, 140, 200], .2, h * .3); dhulfiqar(g, x + w * .4, y + h * .8, h * .64, .3, { bend: .2, w: .12 }); },
    l(g, x, y, w, h, t) { const k = (t / 4.6) % 1, a = .3, L = h * .64, bx = x + w * .4, by = y + h * .8, v = mix(-.05, 1.05, ease(k)); const px = bx + Math.cos(a) * .2 * L * v * v + Math.sin(a) * L * v, py = by + Math.sin(a) * .2 * L * v * v - Math.cos(a) * L * v; g.save(); g.globalCompositeOperation = 'lighter'; glow(g, px, py, h * .07, [255, 240, 200], .6 * Math.sin(Math.PI * k), h * .03); g.restore(); } },
  mabit: { // the night of al-Mabit keeps its own wide frame, set in a band of night
    p(g, x, y, w, h, r) { vgrad(g, x, y, w, h, [[0, [8, 12, 30]], [.6, [28, 30, 56]], [1, [16, 14, 20]]]); stars(g, x, y, w, h * .4, 40, r, .9); const bh = Math.min(h * .8, w / 2.4); mabit(g, x, y + (h - bh) * .55, w, bh, bh / 88, r); },
    l(g, x, y, w, h, t) { const bh = Math.min(h * .8, w / 2.4); mabitLive(g, x, y + (h - bh) * .55, w, bh, bh / 88, t); } },
};

// Ali at the centre: a slow radiance and faint turning rays behind him; he stands veiled, his disc just over (x, y)
function grandLight(c, x, y, r, t) {
  const br = 1 + .05 * Math.sin(t * 1.1);
  c.save(); c.globalCompositeOperation = 'lighter';
  glow(c, x, y, r * 36 * br, [150, 108, 60], .4);
  glow(c, x, y, r * 15 * br, C.gold, .5);
  c.translate(x, y); c.rotate(t * .025);
  for (let i = 0; i < 40; i++) { const a = i / 40 * TAU + hash(i) * .1, len = r * (16 + 14 * hash(i, 1)) * (.8 + .2 * Math.sin(t * .6 + i * 1.3)), wd = r * (.25 + .4 * hash(i, 2)); c.fillStyle = css(C.goldHi, .03 + .025 * hash(i, 3)); c.beginPath(); c.moveTo(Math.cos(a - .5 * Math.PI) * wd * .2, Math.sin(a - .5 * Math.PI) * wd * .2); c.lineTo(Math.cos(a) * len - Math.sin(a) * wd, Math.sin(a) * len + Math.cos(a) * wd); c.lineTo(Math.cos(a) * len + Math.sin(a) * wd, Math.sin(a) * len - Math.cos(a) * wd); c.closePath(); c.fill(); }
  c.restore(); c.save(); c.globalCompositeOperation = 'lighter';
  glow(c, x, y, r * 5.5 * br, C.goldHi, .45);
  c.restore();
  const pt = S && S.port, h = r * (pt ? 9 : 11.5); // a tall screen keeps him clear of the name below
  holy(c, { who: 'ali', pose: 'stand', x, y: y - r * (pt ? 3 : 1.5) + h * .924, h, t, amb: .5 }, 1.2);
}

function build() {
  const W = hero.clientWidth, H = hero.clientHeight, dpr = Math.min(2, devicePixelRatio || 1), port = W / H < .85, L = port ? PORT : LAND;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const [lx, ly] = [L.light[0] * W, L.light[1] * H], R0 = Math.max(6.5, Math.min(W, H) * .0125);
  // the pools of ink: each an overlap of a few ellipses, all washed as one
  const spread = Math.max(8, Math.min(W, H) * .02);
  const shape = mkc(W, H), sg = shape.getContext('2d'); sg.fillStyle = '#fff';
  const blobs = L.blobs.map(([key, fx, fy, fw, fh], i) => {
    const cx = fx * W, cy = fy * H, w = fw * W, h = fh * H, r = rng(70 + i);
    sg.beginPath(); sg.ellipse(cx, cy, w * .44, h * .42, (r() - .5) * .2, 0, TAU); sg.fill();
    for (let k = 0; k < 4; k++) { const a = r() * TAU; sg.beginPath(); sg.ellipse(cx + Math.cos(a) * w * .16, cy + Math.sin(a) * h * .14, w * (.2 + r() * .14), h * (.2 + r() * .14), r() * TAU, 0, TAU); sg.fill(); }
    return { key, cx, cy, w, h, i };
  });
  const ink = inkify(shape, { seed: 31, spread, angle: -.3, streakL: Math.min(W, H) * .07, reach: 1.85, rough: .6, edge: spread * .5 });
  const lay = mkc(W * dpr, H * dpr), lg = lay.getContext('2d');
  const base = mkc(W * dpr, H * dpr), bgc = base.getContext('2d'); bgc.scale(dpr, dpr);
  vgrad(bgc, 0, 0, W, H, [[0, [60, 50, 80]], [.5, [170, 120, 90]], [1, [60, 44, 40]]]);
  const V = blobs.map((bl, i) => { const P = PAINT[bl.key], x0 = bl.cx - bl.w / 2, y0 = bl.cy - bl.h / 2; return vignette(x0, y0, bl.w, bl.h, dpr, P.p, i + 1, { m: spread, round: true, drift: .5, live: (g, t) => P.l(g, x0, y0, bl.w, bl.h, t) }); });
  const wash = washTexture(W, H, 7, .3), rimGold = tint(ink.rim, [214, 170, 92], 1);
  const spl = mkc(W * dpr, H * dpr), sp = spl.getContext('2d'); sp.scale(dpr, dpr); splatter(sp, ink, rng(17), { sprays: port ? 50 : 80, inside: 200 });
  // background: night, the light's warmth, smoke-dark sweeps, and the threads from the centre to every scene
  const bg = mkc(W * dpr, H * dpr), b = bg.getContext('2d'); b.scale(dpr, dpr);
  vgrad(b, 0, 0, W, H, [[0, [9, 13, 26]], [.6, [12, 14, 22]], [1, [9, 10, 13]]]);
  const wt = washTexture(W, H, 33, .5); b.globalAlpha = .7; b.drawImage(wt, 0, 0, W, H); b.globalAlpha = 1;
  stars(b, 0, 0, W, H, 200, rng(12), .4);
  brush(b, [[-40, H * .55], [W * .3, H * .38], [W * .7, H * .3], [W + 40, H * .12]], Math.min(W, H) * .32, [28, 36, 66], .4, 5, { dry: .5, body: .5 });
  brush(b, [[-40, H * .95], [W * .45, H * .7], [W + 40, H * .62]], Math.min(W, H) * .2, [30, 40, 70], .35, 6, { dry: .5, body: .5 });
  const threads = blobs.map((bl, i) => {
    const dx = bl.cx - lx, dy = bl.cy - ly, d = Math.hypot(dx, dy), nx = -dy / d, ny = dx / d, curl = (i % 2 ? 1 : -1) * d * .09;
    const end = [bl.cx - dx / d * Math.min(bl.w, bl.h) * .3, bl.cy - dy / d * Math.min(bl.w, bl.h) * .3], start = [lx + dx / d * R0 * 7, ly + dy / d * R0 * 7];
    const pts = [start, [lx + dx * .35 + nx * curl, ly + dy * .35 + ny * curl], [lx + dx * .7 + nx * curl * .6, ly + dy * .7 + ny * curl * .6], end];
    brush(b, pts, Math.max(5, R0 * 1.2), C.gold, .32, 40 + i, { dry: .95, gaps: 14, steps: 120 });
    const samp = []; for (let k = 0; k <= 60; k++) samp.push(crPt(pts, k / 60 * 3)); return { pts, samp, nx, ny, curl };
  });
  S = { W, H, dpr, port, lx, ly, R0, lay, lg, base, V, wash, ink, rimGold, spl, bg, threads, grain: grainTile(8),
    smoke: Array.from({ length: 12 }, (_, i) => ({ a: hash(i) * TAU, r: .12 + hash(i, 1) * .2, sp: (.02 + hash(i, 2) * .03) * (i % 2 ? 1 : -1), s: .1 + hash(i, 3) * .12 })),
    motes: Array.from({ length: 70 }, (_, i) => [hash(i, 5), hash(i, 6), .3 + hash(i, 7), hash(i, 8)]) };
  const root = document.documentElement.style;
  root.setProperty('--n-y', `${L.name * H}px`); root.setProperty('--n-fs', `${port ? Math.min(92, W * .23) : Math.min(140, H * .15)}px`);
  root.setProperty('--q-y', `${L.quote * H}px`); root.setProperty('--q-fs', `${port ? Math.min(28, W * .07) : Math.min(42, H * .045)}px`);
}

function frame(t) {
  const s = S; if (!s) return;
  const { W, H, dpr, lg, lay, lx, ly, R0 } = s;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.drawImage(s.bg, 0, 0);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // smoke turning slowly around the light
  s.smoke.forEach((m) => { const a = m.a + t * m.sp, x = lx + Math.cos(a) * m.r * W, y = ly + Math.sin(a) * m.r * H * .8; glow(ctx, x, y, m.s * Math.min(W, H) * 1.6, [40, 52, 90], .28, m.s * Math.min(W, H)); });
  // the scenes, through their pools of ink
  lg.setTransform(1, 0, 0, 1, 0, 0); lg.globalCompositeOperation = 'source-over'; lg.clearRect(0, 0, lay.width, lay.height);
  lg.drawImage(s.base, 0, 0);
  lg.setTransform(dpr, 0, 0, dpr, 0, 0); drawVignettes(lg, s.V, t);
  lg.setTransform(1, 0, 0, 1, 0, 0);
  lg.drawImage(s.wash, 0, 0, lay.width, lay.height);
  lg.globalAlpha = .75; lg.drawImage(s.ink.edge, 0, 0, lay.width, lay.height); lg.globalAlpha = 1;
  lg.globalCompositeOperation = 'destination-in'; lg.drawImage(s.ink.mask, 0, 0, lay.width, lay.height); lg.globalCompositeOperation = 'source-over';
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(lay, 0, 0);
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .36 + .08 * Math.sin(t * .7); ctx.drawImage(s.rimGold, 0, 0, cv.width, cv.height); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(s.spl, 0, 0);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // threads of light: a sway along each, and sparks running out from the centre
  ctx.globalCompositeOperation = 'lighter';
  s.threads.forEach((th, i) => {
    ctx.strokeStyle = css(C.goldHi, .16); ctx.lineWidth = 1; ctx.beginPath();
    th.samp.forEach(([x, y], k) => { const w = Math.sin(k * .25 - t * 1.6 + i) * R0 * .9 * Math.sin(Math.PI * k / 60); const px = x + th.nx * w, py = y + th.ny * w; k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }); ctx.stroke();
    for (let j = 0; j < 4; j++) { const k = ((t * .09 + j / 4 + i * .13) % 1), q = th.samp[Math.floor(k * 60)]; glow(ctx, q[0], q[1], R0 * (1.2 + .8 * Math.sin(Math.PI * k)), C.goldHi, .8 * Math.sin(Math.PI * k)); }
  });
  ctx.globalCompositeOperation = 'source-over';
  grandLight(ctx, lx, ly, R0, t);
  ctx.globalCompositeOperation = 'lighter';
  s.motes.forEach(([mx, my, sp, ph]) => { const y = ((my - t * .012 * sp) % 1 + 1) % 1, x = mx + Math.sin(t * .4 + ph * 9) * .01; glow(ctx, x * W, y * H, 2.2 + sp * 2, C.goldHi, .3 * Math.sin(Math.PI * y)); });
  ctx.globalCompositeOperation = 'source-over';
  finish(ctx, cv, s.grain, t);
}

boot([['700 100px "Aref Ruqaa"', 'عليّ مَن كنتُ مولاه فهذا عليٌّ مولاه'], ['400 20px "Reem Kufi"', 'ابن أبي طالب عليه السلام']], build, frame);
